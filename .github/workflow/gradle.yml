name: CI/CD for PortForU-Crawler (ECR & Deploy via Bastion)

on:
  push:
    branches: [ "dev" ]

# 공통 env 선언
env:
  ECR_REGISTRY: 040067931167.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: portforu-crawler
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: ap-northeast-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build JAR (skip tests)
        run: ./gradlew build -x test

      - name: nConfigure AWS credetials on runner
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR (on runner)
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry: ${{ env.ECR_REGISTRY }}

      - name: Build & Push Docker image to ECR
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Save Bastion SSH key
        run: |
          echo "${{ secrets.BASTION_SSH_KEY }}" > bastion.pem
          chmod 600 bastion.pem

      - name: Deploy to private EC2 via Bastion
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i bastion.pem \
              -o ProxyCommand="ssh -o StrictHostKeyChecking=no -i bastion.pem -W %h:%p ${{ secrets.BASTION_USER }}@${{ secrets.BASTION_HOST }}" \
              ${{ secrets.PRIVATE_USER }}@${{ secrets.PRIVATE_HOST }} << 'EOF'

            # 환경변수 내보내기 (원격 호스트에서 ECR 인증용)
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_ECR_SECRET_ACCESS_KEY }}
            export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}

            # ECR 로그인 & 이미지 갱신
            aws ecr get-login-password --region $AWS_DEFAULT_REGION \
              | docker login --username AWS --password-stdin $ECR_REGISTRY

            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # 기존 컨테이너 종료/삭제
            docker stop portforu-crawler   || true
            docker rm   portforu-crawler   || true

            # 신규 컨테이너 실행
            docker run -d \
              --name portforu-crawler \
              -p 8081:8081 \
              --restart always \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          EOF
