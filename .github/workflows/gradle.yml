name: CI/CD for PortForU-Crawler (ECR & Deploy via Bastion)

on:
  push:
    branches: [ "dev" ]

env:
  ECR_REGISTRY: 040067931167.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: portforu-crawler

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build JAR (skip tests)
        run: ./gradlew build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image to ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Create .env file
        run: |
          echo "spring.datasource.url=${{ secrets.DB_URL }}"        > .env
          echo "spring.datasource.username=${{ secrets.DB_USER }}" >> .env
          echo "spring.datasource.password=${{ secrets.DB_PASSWORD }}" >> .env

      - name: Save Bastion private key
        run: |
          echo "${{ secrets.BASTION_SSH_KEY }}" > portforu-bastion.pem
          chmod 600 portforu-bastion.pem

      - name: Copy .env file to EC2 via Bastion
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i portforu-bastion.pem \
            -o ProxyJump=${{ secrets.BASTION_USER }}@${{ secrets.BASTION_HOST }} \
            .env \
            ${{ secrets.PRIVATE_USER }}@${{ secrets.PRIVATE_HOST }}:/home/ubuntu/.env

      - name: Deploy to Private EC2 via Bastion
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i portforu-bastion.pem \
            -o ProxyJump=${{ secrets.BASTION_USER }}@${{ secrets.BASTION_HOST }} \
            ${{ secrets.PRIVATE_USER }}@${{ secrets.PRIVATE_HOST }} << 'EOF'
          
              # 1) ECR 로그인
              aws ecr get-login-password --region ap-northeast-2 \
                | docker login --username AWS --password-stdin $ECR_REGISTRY

              # 2) 새 이미지 Pull
              docker pull $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

              # 3) 기존 컨테이너 중지/제거
              if docker ps -a --filter "name=portforu-crawler" -q | grep -q .; then
                docker stop portforu-crawler || true
                docker rm   portforu-crawler || true
              fi

              # 4) 새 컨테이너 실행
              docker run -d \
                --name portforu-crawler \
                --env-file /home/ubuntu/.env \
                -p 8081:8081 \
                $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

            EOF
