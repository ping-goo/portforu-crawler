name: CI/CD for PortForU-Crawler (ECR & Deploy via Bastion with .env)

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build JAR (skip tests)
        run: ./gradlew build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image to ECR
        env:
          ECR_REGISTRY: 040067931167.dkr.ecr.ap-northeast-2.amazonaws.com
          ECR_REPOSITORY: portforu-crawler
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Create .env file
        run: |
          echo "spring.datasource.url=${{ secrets.DB_URL }}" >> .env
          echo "spring.datasource.username=${{ secrets.DB_USERNAME }}" >> .env
          echo "spring.datasource.password=${{ secrets.DB_PASSWORD }}" >> .env

      - name: Deploy to Private EC2 via Bastion
        run: |
          # Save bastion private key
          echo "${{ secrets.BASTION_SSH_KEY }}" > portforu-bastion.pem
          chmod 600 portforu-bastion.pem
          
          # Connect via Bastion -> Private EC2
          ssh -o StrictHostKeyChecking=no -i portforu-bastion.pem \
            -o ProxyCommand="ssh -o StrictHostKeyChecking=no -i portforu-bastion.pem -W %h:%p ${{ secrets.BASTION_USER }}@${{ secrets.BASTION_HOST }}" \
            ${{ secrets.PRIVATE_USER }}@${{ secrets.PRIVATE_HOST }} << EOF
          
            # Docker login to ECR (EC2 안에서)
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 040067931167.dkr.ecr.ap-northeast-2.amazonaws.com
          
            # Docker pull latest image
            docker pull 040067931167.dkr.ecr.ap-northeast-2.amazonaws.com/portforu-crawler:${{ github.sha }}
          
            # Stop and remove old container if exists
            if [ \$(docker ps -a -q --filter "name=portforu-crawler") ]; then
              docker stop portforu-crawler || true
              docker rm portforu-crawler
            fi
          
            # Run new container
            docker run -d --name portforu-crawler --env-file .env -p 8081:8081 \
              040067931167.dkr.ecr.ap-northeast-2.amazonaws.com/portforu-crawler:${{ github.sha }}
          
          EOF